<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Outer Arc for SWASTIK (sweeps clockwise along top) -->
    <path id="swastik-top-path" d="M 38,150 A 112,112 0 0,1 262,150" fill="none" />
    
    <!-- Outer Arc for HEALTHCARE (sweeps clockwise along bottom) -->
    <path id="healthcare-bottom-path" d="M 262,150 A 112,112 0 0,1 38,150" fill="none" />
  </defs>

  <!-- Outer deep royal blue ring -->
  <circle cx="150" cy="150" r="146" fill="#084298" stroke="#063275" stroke-width="2" />

  <!-- Arched White Text: SWASTIK at top -->
  <text font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="29" fill="#ffffff" letter-spacing="4">
    <textPath href="#swastik-top-path" startOffset="50%" text-anchor="middle">SWASTIK</textPath>
  </text>

  <!-- Arched White Text: HEALTHCARE at bottom -->
  <text font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="25" fill="#ffffff" letter-spacing="4">
    <textPath href="#healthcare-bottom-path" startOffset="50%" text-anchor="middle">HEALTHCARE</textPath>
  </text>

  <!-- Vibrant Lime Green Middle Ring -->
  <circle cx="150" cy="150" r="105" fill="#86d800" stroke="#084298" stroke-width="3" />

  <!-- Left Swastik Symbol on green ring (at 9 o'clock) -->
  <g transform="translate(64, 150) scale(0.65)" stroke="#084298" stroke-width="3.2" stroke-linecap="square" fill="none">
    <line x1="-12" y1="0" x2="12" y2="0" />
    <line x1="0" y1="-12" x2="0" y2="12" />
    <line x1="0" y1="-12" x2="8" y2="-12" />
    <line x1="12" y1="0" x2="12" y2="8" />
    <line x1="0" y1="12" x2="-8" y2="12" />
    <line x1="-12" y1="0" x2="-12" y2="-8" />
  </g>

  <!-- Right Swastik Symbol on green ring (at 3 o'clock) -->
  <g transform="translate(236, 150) scale(0.65)" stroke="#084298" stroke-width="3.2" stroke-linecap="square" fill="none">
    <line x1="-12" y1="0" x2="12" y2="0" />
    <line x1="0" y1="-12" x2="0" y2="12" />
    <line x1="0" y1="-12" x2="8" y2="-12" />
    <line x1="12" y1="0" x2="12" y2="8" />
    <line x1="0" y1="12" x2="-8" y2="12" />
    <line x1="-12" y1="0" x2="-12" y2="-8" />
  </g>

  <!-- Central Circular Disc (Royal Blue) -->
  <circle cx="150" cy="150" r="78" fill="#0052cc" stroke="#ffffff" stroke-width="2.5" />

  <!-- Subtle ground baseline in the center -->
  <line x1="88" y1="184" x2="212" y2="184" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round" />

  <!-- FIGURE 1 (LEFT): Wheelchair Patient (Rehab Phase 1) -->
  <g id="figure-wheelchair" transform="translate(94, 142)">
    <!-- Wheelchair big back wheel (white circle & spoke cross) -->
    <circle cx="14" cy="24" r="14" fill="none" stroke="#ffffff" stroke-width="2" />
    <circle cx="14" cy="24" r="11" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2,2" />
    <circle cx="14" cy="24" r="2.5" fill="#ffffff" />
    <!-- Wheel spokes -->
    <line x1="14" y1="10" x2="14" y2="38" stroke="#ffffff" stroke-width="1" />
    <line x1="0" y1="24" x2="28" y2="24" stroke="#ffffff" stroke-width="1" />
    <!-- Small front wheel / footrest -->
    <circle cx="34" cy="34" r="3.5" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <path d="M 22,28 L 32,34 L 35,32" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <!-- Wheelchair frame & push handle -->
    <path d="M 2,12 L 8,14 L 14,24 L 25,24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <!-- Patient body in lime green -->
    <circle cx="17" cy="6" r="4.5" fill="#88dc00" />
    <path d="M 16,11 L 13,24 L 24,24 L 28,32" fill="none" stroke="#88dc00" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 15,15 L 20,20 L 16,24" fill="none" stroke="#88dc00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FIGURE 2 (MIDDLE): Walking with Cane (Rehab Phase 2) -->
  <g id="figure-walking-cane" transform="translate(142, 126)">
    <!-- White walking stick / cane -->
    <path d="M 21,30 C 23,28 25,28 26,30 L 26,58" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <circle cx="13" cy="6" r="4.5" fill="#88dc00" />
    <path d="M 12,11 L 10,28" fill="none" stroke="#88dc00" stroke-width="4" stroke-linecap="round" />
    <path d="M 10,28 L 6,43 L 3,57" fill="none" stroke="#88dc00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 10,28 L 15,42 L 18,57" fill="none" stroke="#88dc00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 11,16 L 18,24 L 23,32" fill="none" stroke="#88dc00" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FIGURE 3 (RIGHT): Fully Recovered Standing Upright (Rehab Phase 3) -->
  <g id="figure-recovered" transform="translate(182, 124)">
    <circle cx="14" cy="5" r="4.5" fill="#88dc00" />
    <path d="M 14,10 L 14,29" fill="none" stroke="#88dc00" stroke-width="4.2" stroke-linecap="round" />
    <path d="M 14,29 L 10,44 L 8,59" fill="none" stroke="#88dc00" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 14,29 L 18,44 L 20,59" fill="none" stroke="#88dc00" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 13,15 L 7,21 L 12,27" fill="none" stroke="#88dc00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 15,15 L 21,21 L 16,27" fill="none" stroke="#88dc00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- SINCE : 2009 text badge in inner disc -->
  <g transform="translate(150, 208)">
    <rect x="-42" y="-12" width="84" height="15" rx="3" fill="#ffffff" fill-opacity="0.15" />
    <text text-anchor="middle" y="0" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="10.5" fill="#ffffff" letter-spacing="1.5">
      SINCE : 2009
    </text>
  </g>
</svg>
